# 참값 브리지 서버 설정 — 이 파일을 config.yaml로 복사해서 고칩니다.
# 명령줄 옵션(--mode, --port 등)이 있으면 이 값보다 우선합니다.

mode: mock            # mock | serial | mqtt
serial:
  ports: []           # 비우면 자동 탐색. 예: [COM5, COM6, COM7]
  baud: 115200
mqtt:
  host: 127.0.0.1
  port: 1883
mock:
  speed: 1            # 5면 5배 빠르게 (data 주기 1초, 진단 유지 시간도 1/5)
  scenarios: {}       # 예: {Z2: soil_a_unplugged}
server:
  host: 0.0.0.0
  port: 8000
  allow_raw: true     # 시험 모드의 /api/raw. 시연 때는 false
  pin: null           # 예: "1234" (급수·보정 명령에 PIN 요구, 정지는 항상 허용)
safety:
  max_ml_per_shot: 50
  max_ml_per_day: 300
storage:
  keep_days: 30
