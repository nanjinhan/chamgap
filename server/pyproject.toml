[project]
name = "chamgap-server"
version = "0.1.0"
description = "참값 센서 진단 브리지 서버"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using .httpx. with", "ignore::DeprecationWarning:asyncio.events"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "logs", "data"]
